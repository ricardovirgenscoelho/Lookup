<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RVC DNS Lookup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>RVC DNS Lookup</h1>

    <input type="text" id="domain" placeholder="Digite o domínio">

    <select id="recordType">
        <option value="A">A</option>
        <option value="AAAA">AAAA</option>
        <option value="MX">MX</option>
        <option value="TXT">TXT</option>
        <option value="NS">NS</option>
        <option value="CNAME">CNAME</option>
    </select>

    <button onclick="lookupDNS()">Consultar</button>

    <pre id="result"></pre>
</div>

<script src="script.js"></script>

</body>
</html>
