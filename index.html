<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RVC DNS Lookup</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="brand">
            RVC DNS Lookup
        </div>

        <nav>
            <a href="https://www.rvctech.com.br" target="_blank">Site Principal</a>
            <a href="#">DNS</a>
            <a href="#">SPF</a>
            <a href="#">DKIM</a>
            <a href="#">DMARC</a>
            <a href="#">BIMI</a>
            <a href="#">MTA-STS</a>
        </nav>

    </header>

    <section class="hero">

        <div class="hero-content">

            <span class="badge">
                Ferramentas de Segurança de E-mail
            </span>

            <h1>
                RVC DNS Lookup
            </h1>

            <p>
                Plataforma para consulta de registros DNS e validação
                de SPF, DKIM, DMARC, BIMI e MTA-STS.
            </p>

        </div>

    </section>

    <main>

        <div class="card">

            <h2>Consulta DNS</h2>

            <div class="search-container">

                <input type="text"
                    id="domain"
                    placeholder="Digite o domínio (ex: rvctech.com.br)">

                <select id="recordType">

                    <option value="A">A</option>
                    <option value="AAAA">AAAA</option>
                    <option value="MX">MX</option>
                    <option value="TXT">TXT</option>
                    <option value="NS">NS</option>
                    <option value="CNAME">CNAME</option>
                    <option value="SOA">SOA</option>

                </select>

                <button onclick="lookupDNS()">
                    Consultar
                </button>

            </div>

            <div class="result-container">

                <div class="result-title">
                    Resultado
                </div>

                <pre id="result">
Aguardando consulta...
                </pre>

            </div>

        </div>

    </main>

    <footer>

        <p>
            © 2026 RVC Tech - DNS Lookup Tool
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
